name: Build and publish fork binaries

# Builds three OS targets only when manually requested or dispatched after
# a verified official-release sync; a regular main push must not publish.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'miaopan607/oh-my-pi'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Guard the preserved issue 14801 fix
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'usageRefreshInterval' packages/tui/src/status-line/component.ts
          grep -Fq 'statusLine.usageRefreshInterval' packages/coding-agent/src/modes/settings.ts
          test -f packages/ai/test/auth-broker-usage-freshness.test.ts
      - uses: ./.github/actions/bun-install
      - name: Validate TypeScript
        run: bun run check:ts

  build:
    name: Build ${{ matrix.target }}
    if: github.event_name != 'pull_request'
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
            binary: omp-linux-x64
          - runner: macos-15
            target: darwin-arm64
            binary: omp-darwin-arm64
          - runner: windows-2022
            target: win32-x64
            binary: omp-windows-x64.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config clang libclang-dev libasound2-dev nasm
      - name: Configure Rust toolchain
        run: rustup show active-toolchain
      - uses: ./.github/actions/bun-install
      - name: Build native addon for this platform
        env:
          OMP_NATIVE_CARGO_PROFILE: ci
        run: bun scripts/bazel-natives.ts host --dest packages/natives/native
      - name: Compile real standalone executable
        run: bun scripts/ci-release-build-binaries.ts --targets ${{ matrix.target }}
      - name: Smoke-test executable on its native OS
        run: |
          set -euo pipefail
          binary="packages/coding-agent/binaries/${{ matrix.binary }}"
          test -s "$binary"
          chmod +x "$binary"
          "$binary" --version
          "$binary" --help > /dev/null
      - name: Upload validated executable
        uses: actions/upload-artifact@v4
        with:
          name: fork-${{ matrix.target }}
          path: packages/coding-agent/binaries/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified three-platform release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    needs: [validate, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: fork-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete manifest and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          for name in omp-linux-x64 omp-darwin-arm64 omp-windows-x64.exe; do
            test -s "$name"
          done
          sha256sum omp-linux-x64 omp-darwin-arm64 omp-windows-x64.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish validated SemVer release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::notice::Main advanced; skipping superseded build."
            exit 0
          fi
          version="$(node -p "require('./packages/coding-agent/package.json').version")"
          # Query all pages, including existing prerelease/draft items.
          # Assign a stable semantic version only after all platform jobs pass.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/fork-releases.json"
          tag="$(node scripts/fork/release-version.mjs "$version" "$GITHUB_SHA" "$RUNNER_TEMP/fork-releases.json")"
          echo "Publishing $tag from $GITHUB_SHA"
          cat > "$RUNNER_TEMP/binary-release-notes.md" <<EOF
          # oh-my-pi ${version} — personal fork

          **Release:** ${tag} | **Source commit:** ${GITHUB_SHA}

          Built and smoke-tested on GitHub-hosted runners:
          - Linux x64: \`omp-linux-x64\`
          - macOS ARM64: \`omp-darwin-arm64\`
          - Windows x64: \`omp-windows-x64.exe\`

          Includes the status-line usage refresh fix for https://github.com/can1357/oh-my-pi/issues/14801.
          The independent \`omp-mp\` installer checks SHA-256 and uses fork-owned writable settings.
          This is a community fork release, not an upstream build. Source ZIP/TAR.GZ provided by GitHub.
          EOF
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Keep the release invisible until all four uploaded assets exist.
            gh release create "$tag" --draft --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "oh-my-pi ${tag}" --notes-file "$RUNNER_TEMP/binary-release-notes.md"
          fi
          gh release upload "$tag" release-assets/omp-linux-x64 release-assets/omp-darwin-arm64 release-assets/omp-windows-x64.exe release-assets/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          count="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          [ "$count" -ge 4 ] || { echo "::error::Not all binaries and checksums were uploaded"; exit 1; }
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest --title "oh-my-pi ${tag}" --notes-file "$RUNNER_TEMP/binary-release-notes.md"
