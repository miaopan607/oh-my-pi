name: Format fork settings patch

on:
  push:
    branches: [fix/omp-mp-settings-write-isolation]
    paths:
      - ".github/workflows/fork-format-temp.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/omp-mp-settings-write-isolation
      - uses: ./.github/actions/bun-install
      - name: Format and commit only settings source
        shell: bash
        run: |
          set -euo pipefail
          bunx oxfmt packages/coding-agent/src/config/settings.ts
          if ! git diff --quiet -- packages/coding-agent/src/config/settings.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/coding-agent/src/config/settings.ts
            git commit -m "style: format isolated fork settings store"
            git push origin HEAD:fix/omp-mp-settings-write-isolation
          fi
