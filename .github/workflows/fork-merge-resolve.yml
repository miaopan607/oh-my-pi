name: Verify fork 18.13.2 merge regressions

on:
  push:
    branches: [ci/upstream-resolver]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-22.04
    timeout-minutes: 95
    steps:
      - name: Check out merged upstream plus fork fixes
        uses: actions/checkout@v4
        with:
          repository: miaopan607/oh-my-pi
          ref: fix/windows-bun-child-process
      - name: Install packages
        uses: ./.github/actions/bun-install
      - name: Full TypeScript lint and type checks
        run: bun run check:ts
      - name: Prepare native Rust toolchain and libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config clang libclang-dev libasound2-dev nasm
          rustup show active-toolchain
      - name: Build host native addon for session tests
        shell: bash
        env:
          OMP_NATIVE_CARGO_PROFILE: ci
        run: bun scripts/bazel-natives.ts host --dest packages/natives/native
      - name: Run original issue 14801 regression suite
        run: |
          bun test packages/coding-agent/test/status-line-usage-refresh.test.ts packages/coding-agent/test/codex-auto-reset.test.ts packages/coding-agent/test/claude-auto-reset-integration.test.ts packages/ai/test/auth-broker-usage-freshness.test.ts
