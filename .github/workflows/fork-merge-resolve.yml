name: Resolve October upstream conflict

on:
  push:
    branches: [ci/upstream-resolver]
    paths:
      - ".github/workflows/fork-merge-resolve.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    if: github.repository == 'miaopan607/oh-my-pi'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge and resolve the four reviewed conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/can1357/oh-my-pi.git
          git fetch upstream main --no-tags
          echo "Upstream commit: $(git rev-parse FETCH_HEAD)"
          git merge --no-commit --no-ff FETCH_HEAD || true
          python3 - <<'PY'
          from pathlib import Path
          import re
          paths = {
              "packages/coding-agent/src/session/agent-session.ts": 3,
              "packages/coding-agent/test/claude-auto-reset-integration.test.ts": 1,
              "packages/coding-agent/test/codex-auto-reset.test.ts": 1,
              "packages/coding-agent/test/status-line-usage-refresh.test.ts": 1,
          }
          pat = re.compile(r"^<<<<<<< HEAD\n(.*?)^=======\n(.*?)^>>>>>>>[^\n]*\n",re.M|re.S)
          for file, expected in paths.items():
              p=Path(file)
              text=p.read_text()
              matches=list(pat.finditer(text))
              if len(matches)!=expected:
                  raise SystemExit(f"Unexpected conflicts in {file}: {len(matches)} expected {expected}")
              def resolve(m):
                  ours,theirs=m.group(1),m.group(2)
                  if file.endswith("agent-session.ts"):
                      if "this.#resetSweepReports = reports;" in ours and "this.#usageReports = reports;" in theirs:
                          return theirs.replace("this.#usageReports = reports;", "this.#usageReports = reports;\n\t\t\tthis.#resetSweepReports = reports;")
                      if "refreshResetCredits(): void" in ours and "get cachedUsageReports()" in theirs:
                          ours=ours.replace("this.#resetSweepReports);", "this.#resetSweepReports ?? []);")
                          return ours.rstrip("\n")+"\n\t}\n\n"+theirs
                      if "coordinator.sweepPromise" in ours and "coordinator.sweepPromise" in theirs:
                          return theirs
                  if file.endswith("claude-auto-reset-integration.test.ts"):
                      if 'import { TempDir }' in ours and 'setAgentDir' in theirs:
                          return ours.replace('import { TempDir } from "@oh-my-pi/pi-utils";', 'import { __resetDirsFromEnvForTests, setAgentDir, TempDir } from "@oh-my-pi/pi-utils";')
                  if file.endswith("codex-auto-reset.test.ts"):
                      if "ResetCreditAccountStatus" in ours and "ResetCreditTarget" in theirs:
                          return 'import type { ResetCreditAccountStatus, ResetCreditTarget, UsageReport } from "@oh-my-pi/pi-ai";\n'
                  if file.endswith("status-line-usage-refresh.test.ts"):
                      if "shows fresh usage at a shorter interval" in ours and "does not queue a usage refresh" in theirs:
                          return ours.rstrip("\n")+"\n\t});\n\n"+theirs
                  raise ValueError(f"Unexpected conflict context in {file}: {ours[:100]} / {theirs[:100]}")
              resolved=pat.sub(resolve,text)
              if "<<<<<<<" in resolved or ">>>>>>>" in resolved:
                  raise ValueError(f"Leftover merge markers: {file}")
              p.write_text(resolved)
              print(f"Resolved {file}")
          # Rebuild the complete sweep function from the upstream implementation:
          # the overlapping refactor left shared braces outside a conflict hunk.
          # Retain the fork's 5-minute reset heartbeat and missing-report fallback.
          import subprocess
          session_file=Path("packages/coding-agent/src/session/agent-session.ts")
          merged=session_file.read_text()
          upstream=subprocess.check_output(
              ["git","show","FETCH_HEAD:packages/coding-agent/src/session/agent-session.ts"],text=True
          )
          def sweep_span(data):
              a=data.index("\t#maybeScheduleResetSweep(")
              b=data.index("\n\t/**\n\t * Export session to HTML.",a)
              return a,b
          a,b=sweep_span(merged)
          c,d=sweep_span(upstream)
          sweep=upstream[c:d]
          sweep=sweep.replace("reports: UsageReport[]", "reports: UsageReport[] | null",1)
          sweep=sweep.replace(
              'reports.some(report => report.provider === "openai-codex")',
              '(reports?.some(report => report.provider === "openai-codex") || this.#modelRegistry.authStorage.credentials.hasOAuth("openai-codex"))'
          )
          sweep=sweep.replace(
              'reports.some(report => report.provider === "anthropic")',
              '(reports?.some(report => report.provider === "anthropic") || this.#modelRegistry.authStorage.credentials.hasOAuth("anthropic"))'
          )
          sweep=sweep.replace(
              'claudeResetStatusesFromReports(accounts, reports)',
              'claudeResetStatusesFromReports(accounts, reports ?? [])'
          )
          sweep=sweep.replace("candidates.actions.length > 0", "!reports || candidates.actions.length > 0")
          sweep=sweep.replace(
              "const coordinator = this.#resetCoordinator;",
              "if (this.#isDisposed) return;\n\t\tconst coordinator = this.#resetCoordinator;",1
          )
          assert "hasOAuth" in sweep and "reports ?? []" in sweep
          session_file.write_text(merged[:a]+sweep+merged[b:])
          print("Reconciled complete upstream sweep implementation with fork heartbeat.")
          PY
          git add -A
          if git ls-files -u | grep -q .; then
            git ls-files -u
            echo "::error::Unresolved merge conflict"
            exit 1
          fi
          git diff --cached --check -- packages/coding-agent/src/session/agent-session.ts packages/coding-agent/test/claude-auto-reset-integration.test.ts packages/coding-agent/test/codex-auto-reset.test.ts packages/coding-agent/test/status-line-usage-refresh.test.ts
          git commit -m "merge: upstream main with #14801 refresh configuration"
      - uses: ./.github/actions/bun-install
      - name: Format resolved session file and commit mechanical formatting
        shell: bash
        run: |
          set -euo pipefail
          bunx oxfmt packages/coding-agent/src/session/agent-session.ts
          if ! git diff --quiet -- packages/coding-agent/src/session/agent-session.ts; then
            git add packages/coding-agent/src/session/agent-session.ts
            git commit -m "style: format merged upstream reset sweep"
          fi
      - name: Validate all TypeScript
        run: bun run check:ts
      - name: Materialize verified merge commit using GitHub Git objects API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          def git(*args):
              return subprocess.check_output(["git", *args])
          def create(endpoint, payload):
              url=f"https://api.github.com/repos/{repo}/git/{endpoint}"
              data=json.dumps(payload).encode()
              req=urllib.request.Request(url,data=data,method="POST",headers={
                  "Authorization":f"Bearer {token}",
                  "Accept":"application/vnd.github+json",
                  "User-Agent":"fork-upstream-merge",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "Content-Type":"application/json"
              })
              with urllib.request.urlopen(req,timeout=90) as response:
                  return json.load(response)
          base=git("rev-parse","FETCH_HEAD").decode().strip()
          upstream_tree=git("rev-parse","FETCH_HEAD^{tree}").decode().strip()
          merge_ref=git("rev-list","--first-parent","--min-parents=2","--max-parents=2","-1","HEAD").decode().strip()
          fork_parent=git("rev-parse",merge_ref+"^1").decode().strip()
          expected_tree=git("rev-parse","HEAD^{tree}").decode().strip()
          paths=[p.decode() for p in git("diff","--no-renames","--name-only","-z",base,"HEAD").split(b"\x00") if p]
          print("Files differing from upstream:",len(paths))
          if len(paths)>150:
              raise SystemExit("Unexpectedly broad fork diff; refusing Git object creation.")
          elements=[]
          for path in paths:
              entry=git("ls-tree","-z","HEAD","--",path).split(b"\x00")[0]
              if not entry:
                  elements.append({"path":path,"mode":"100644","type":"blob","sha":None})
                  continue
              meta=entry.split(b"\t",1)[0].decode().split()
              mode,kind,expected_blob=meta
              if kind=="blob":
                  data=git("show",f"HEAD:{path}")
                  if len(data)>2500000: raise SystemExit(f"Oversize fork overlay: {path}")
                  response=create("blobs",{"content":base64.b64encode(data).decode(),"encoding":"base64"})
                  if response["sha"]!=expected_blob:
                      raise SystemExit(f"Git blob mismatch for {path}")
                  blob_sha=response["sha"]
              else:
                  blob_sha=expected_blob
              elements.append({"path":path,"mode":mode,"type":kind,"sha":blob_sha})
          tree=create("trees",{"base_tree":upstream_tree,"tree":elements})["sha"]
          print("Expected tree:",expected_tree,"API tree:",tree)
          if tree!=expected_tree: raise SystemExit("Git tree mismatch; no commit created.")
          obj=create("commits",{
              "message":"merge: upstream main with verified #14801 refresh fix",
              "tree":tree,
              "parents":[fork_parent,base],
          })
          print("VERIFIED_MERGE_COMMIT_SHA="+obj["sha"])
          print("EXPECTED_PARENT_MAIN_SHA="+fork_parent)
          print("UPSTREAM_MERGE_PARENT_SHA="+base)
          PY
