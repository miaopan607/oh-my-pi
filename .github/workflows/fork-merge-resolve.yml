name: Verify fork 18.13.2 merge regressions
# Debug in-flight usage query resetting independent heartbeat (e3f3804c).

on:
  push:
    branches: [ci/upstream-resolver]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-22.04
    timeout-minutes: 95
    steps:
      - name: Check out merged upstream plus fork fixes
        uses: actions/checkout@v4
        with:
          repository: miaopan607/oh-my-pi
          ref: fix/windows-bun-child-process
      - name: Install packages
        uses: ./.github/actions/bun-install
      - name: Full TypeScript lint and type checks
        run: bun run check:ts
      - name: Reuse signed upstream 18.13.2 native addon for fast regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages/natives/native
          tarball="$(npm pack --silent --pack-destination "$RUNNER_TEMP" @oh-my-pi/pi-natives-linux-x64@18.13.2)"
          mkdir -p "$RUNNER_TEMP/native-leaf"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/native-leaf"
          cp "$RUNNER_TEMP/native-leaf/package/"*.node packages/natives/native/
          ls -lh packages/natives/native/pi_natives.linux-x64*.node
      - name: Instrument Claude heartbeat test on runner only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("packages/coding-agent/test/claude-auto-reset-integration.test.ts")
          code=p.read_text()
          needle='expect(targets.map(target => target.creditId)).toEqual(autoRedeem === "yes" ? ["cedar-grant-1"] : []);'
          assert code.count(needle)==1
          trace='console.error("HEARTBEAT_DEBUG", JSON.stringify({ autoRedeem, hasUsage, initialListings, finalListings: listings.mock.calls.length, lastSweepAt: coordinator.lastSweepAt, now, targets }));'
          p.write_text(code.replace(needle,trace+'\n\t\t\t\t'+needle))
          PY
      - name: Run original issue 14801 regression suite
        run: |
          bun test packages/coding-agent/test/status-line-usage-refresh.test.ts packages/coding-agent/test/codex-auto-reset.test.ts packages/coding-agent/test/claude-auto-reset-integration.test.ts packages/ai/test/auth-broker-usage-freshness.test.ts
