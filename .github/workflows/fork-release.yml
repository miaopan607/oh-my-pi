name: Fork source release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-source-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'miaopan607/oh-my-pi'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require current main and preserved fork fix
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::notice::Newer main exists; skipping release of superseded commit."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          grep -Fq 'usageRefreshInterval' packages/tui/src/status-line/component.ts
          grep -Fq 'statusLine.usageRefreshInterval' packages/coding-agent/src/modes/settings.ts
          test -f packages/ai/test/auth-broker-usage-freshness.test.ts
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Install Bun and dependencies
        if: steps.guard.outputs.current == 'true'
        uses: ./.github/actions/bun-install

      - name: Validate TypeScript code before publishing
        if: steps.guard.outputs.current == 'true'
        run: bun run check:ts

      - name: Publish GitHub source release
        if: steps.guard.outputs.current == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/coding-agent/package.json').version")"
          short="$(git rev-parse --short=12 HEAD)"
          tag="fork-v${version}-${short}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          cat > "$RUNNER_TEMP/fork-notes.md" <<EOF
          Personal oh-my-pi fork source release based on package version ${version}.

          - Includes the configurable status-line usage refresh from [#14801](https://github.com/can1357/oh-my-pi/issues/14801).
          - Source commit: ${GITHUB_SHA}.
          - TypeScript check passed on GitHub Actions.
          - **Prerelease source snapshot:** not promoted to latest stable until all three platform executables pass validation and are uploaded.
          - Upstream: https://github.com/can1357/oh-my-pi
          EOF
          gh release create "$tag" --prerelease --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "oh-my-pi fork ${version} (${short})" --notes-file "$RUNNER_TEMP/fork-notes.md"
