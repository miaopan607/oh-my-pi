name: Sync official stable releases

# Check for official stable upstream releases every hour.
# Manual runs remain available; concurrency prevents overlapping sync jobs.
on:
  # Verify sync changes immediately, without rebuilding on ordinary pushes.
  push:
    branches: [main]
    paths:
      - ".github/workflows/fork-sync.yml"
      # A fix to the sync machinery should be checked immediately on main.
      - "scripts/fork/**"
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fork-upstream-stable-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'miaopan607/oh-my-pi'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out maintained fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # Optional fine-grained PAT: Contents + Workflows read/write for
          # upstream releases that change files under .github/workflows.
          token: ${{ secrets.FORK_SYNC_TOKEN || github.token }}

      - name: Test official-release selection and safe merge behavior
        run: node --test scripts/fork/select-upstream-release.test.mjs scripts/fork/merge-official-stable.test.mjs

      - name: Find latest published official stable release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$(gh api repos/can1357/oh-my-pi/releases/latest)"
          tag="$(printf '%s\n' "$release" | node scripts/fork/select-upstream-release.mjs)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo "## Official stable release check"
            echo "Selected: $tag (can1357/oh-my-pi)"
            echo "Only a published stable GitHub Release is eligible; upstream main is not fetched."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Merge only the official release tag, preserving fork changes
        id: merge
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: bash scripts/fork/merge-official-stable.sh

      - name: Prepare a push that respects workflow permissions
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        env:
          HAS_FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN != '' }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          # The default GITHUB_TOKEN cannot push commits that modify Actions
          # workflows. Resetting workflow files in a follow-up merge commit is
          # insufficient: GitHub checks the incoming commit history as well.
          if [[ "$HAS_FORK_SYNC_TOKEN" == "true" ]]; then
            echo "Using FORK_SYNC_TOKEN; preserving upstream merge ancestry."
            exit 0
          fi
          base="$(git rev-parse origin/main)"
          if git log --format= --name-only "$base"..HEAD -- .github/workflows/ | grep -q '[^[:space:]]'; then
            echo "Upstream history changes Actions workflows; preparing a workflow-free snapshot commit."
            # Squash the verified merge into a single-parent commit so the
            # restricted upstream workflow commits are not pushed.
            git reset --soft "$base"
            git restore --source="$base" --staged --worktree -- .github/workflows/
            if git diff --cached --quiet; then
              echo "No changes outside Actions workflows in $RELEASE_TAG."
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              git commit -m "chore(sync): import official stable $RELEASE_TAG (exclude workflows)"
            fi
            {
              echo "## Restricted workflow changes skipped"
              echo "Imported non-workflow updates from $RELEASE_TAG without pushing restricted workflow history."
              echo "Local .github/workflows files remain authoritative until a workflow-capable token is supplied."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify preserved fork fixes
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'usageRefreshInterval' packages/tui/src/status-line/component.ts
          grep -Fq 'statusLine.usageRefreshInterval' packages/coding-agent/src/modes/settings.ts
          test -f packages/ai/test/auth-broker-usage-freshness.test.ts
          test -f packages/coding-agent/test/status-line-usage-refresh.test.ts

      - name: Install Bun and dependencies
        if: steps.merge.outputs.changed == 'true'
        uses: ./.github/actions/bun-install

      - name: Run TypeScript verification
        if: steps.merge.outputs.changed == 'true'
        run: bun run check:ts

      - name: Install Linux dependencies for native addon
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config clang libclang-dev libasound2-dev nasm

      - name: Build pi_natives before fork regression tests
        if: steps.merge.outputs.changed == 'true'
        env:
          OMP_NATIVE_CARGO_PROFILE: ci
        run: bun scripts/bazel-natives.ts host --dest packages/natives/native

      - name: Test fork-specific behavior
        if: steps.merge.outputs.changed == 'true'
        run: |
          bun test \
            packages/coding-agent/test/status-line-usage-refresh.test.ts \
            packages/ai/test/auth-broker-usage-freshness.test.ts \
            packages/coding-agent/test/config/fork-settings-isolation.test.ts \
            packages/coding-agent/test/codex-auto-reset.test.ts \
            packages/coding-agent/test/claude-auto-reset-integration.test.ts

      - name: Push verified official release merge
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        run: git push origin HEAD:main

      - name: Build and publish fork binaries
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
        run: gh workflow run fork-binaries.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Explain any failed sync in Actions summary
        if: failure()
        shell: bash
        run: |
          {
            echo "## Stable-release synchronization failed"
            echo "No unverified merge was pushed by the sync job."
            echo "Check the failing step for a merge conflict, failed test, or GitHub token permissions."
            echo "If pushing an official release changes .github/workflows files,"
            echo "configure FORK_SYNC_TOKEN with Contents and Workflows write access."
            echo "This repository has Issues disabled; failure details stay in this Actions run."
          } >> "$GITHUB_STEP_SUMMARY"
