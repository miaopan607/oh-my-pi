name: Sync upstream safely

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: fork-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'miaopan607/oh-my-pi'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out maintained fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # A fine-grained PAT with Contents+Workflows write is needed when upstream changes CI workflows.
          token: ${{ secrets.FORK_SYNC_TOKEN || github.token }}

      - name: Merge upstream without rewriting history
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/can1357/oh-my-pi.git
          git fetch upstream main --no-tags
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "No new upstream commits."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge --no-edit --no-ff FETCH_HEAD; then
            git merge --abort || true
            echo "::error::Upstream main cannot be merged automatically; resolve the conflict manually."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify fork patch still exists
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'usageRefreshInterval' packages/tui/src/status-line/component.ts
          grep -Fq 'statusLine.usageRefreshInterval' packages/coding-agent/src/modes/settings.ts
          test -f packages/ai/test/auth-broker-usage-freshness.test.ts

      - name: Install Bun and dependencies
        if: steps.merge.outputs.changed == 'true'
        uses: ./.github/actions/bun-install

      - name: Check TypeScript code
        if: steps.merge.outputs.changed == 'true'
        run: bun run check:ts

      - name: Push verified upstream merge
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        run: git push origin HEAD:main

      - name: Start multi-platform binary build for token-authored push
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
        shell: bash
        run: gh workflow run fork-binaries.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Open or update a maintenance issue on failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
        shell: bash
        run: |
          title="Fork upstream sync requires attention"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty' || true)"
          body="Upstream sync failed on $(date -u +%Y-%m-%d). See workflow run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID . Do not force-push over the fork patch."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
