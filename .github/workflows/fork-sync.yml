name: Sync official stable releases

on:
  workflow_dispatch:
  schedule:
    # GitHub does not send another repository's release event to this fork.
    # Poll twice an hour; the runner also supports manual checks.
    - cron: "17,47 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: fork-upstream-stable-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'miaopan607/oh-my-pi'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out maintained fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # Optional fine-grained PAT: Contents + Workflows read/write for
          # upstream releases that change files under .github/workflows.
          token: ${{ secrets.FORK_SYNC_TOKEN || github.token }}

      - name: Test official-release selection
        run: node --test scripts/fork/select-upstream-release.test.mjs

      - name: Find latest published official stable release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$(gh api repos/can1357/oh-my-pi/releases/latest)"
          tag="$(printf '%s\n' "$release" | node scripts/fork/select-upstream-release.mjs)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo "## Official stable release check"
            echo "Selected: $tag (can1357/oh-my-pi)"
            echo "Only a published stable GitHub Release is eligible; upstream main is not fetched."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Merge only the official release tag, preserving fork changes
        id: merge
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/can1357/oh-my-pi.git
          # Fetch exactly the published tag, never the upstream main tip.
          git fetch --no-tags upstream "refs/tags/$RELEASE_TAG"
          release_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
          echo "Official stable $RELEASE_TAG resolves to $release_sha"
          if git merge-base --is-ancestor "$release_sha" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already includes $RELEASE_TAG; nothing to synchronize." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git merge --no-edit --no-ff "$release_sha"; then
            echo "::error::Official release $RELEASE_TAG conflicts with fork changes. Resolve manually; no force push."
            git diff --name-only --diff-filter=U || true
            git merge --abort || true
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify preserved fork fixes
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'usageRefreshInterval' packages/tui/src/status-line/component.ts
          grep -Fq 'statusLine.usageRefreshInterval' packages/coding-agent/src/modes/settings.ts
          test -f packages/ai/test/auth-broker-usage-freshness.test.ts
          test -f packages/coding-agent/test/status-line-usage-refresh.test.ts

      - name: Install Bun and dependencies
        if: steps.merge.outputs.changed == 'true'
        uses: ./.github/actions/bun-install

      - name: Run TypeScript verification
        if: steps.merge.outputs.changed == 'true'
        run: bun run check:ts

      - name: Test fork-specific behavior
        if: steps.merge.outputs.changed == 'true'
        run: |
          bun test packages/coding-agent/test/status-line-usage-refresh.test.ts packages/ai/test/auth-broker-usage-freshness.test.ts

      - name: Push verified official release merge
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        run: git push origin HEAD:main

      - name: Build and publish fork binaries
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
        run: gh workflow run fork-binaries.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Explain any failed sync in Actions summary
        if: failure()
        shell: bash
        run: |
          {
            echo "## Stable-release synchronization failed"
            echo "No unverified merge was pushed by the sync job."
            echo "Check the failing step for a merge conflict, failed test, or GitHub token permissions."
            echo "If pushing an official release changes .github/workflows files,"
            echo "configure FORK_SYNC_TOKEN with Contents and Workflows write access."
            echo "This repository has Issues disabled; failure details stay in this Actions run."
          } >> "$GITHUB_STEP_SUMMARY"
