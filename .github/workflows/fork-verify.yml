name: Verify maintained fork

# Replace upstream's multi-runner/publishing CI with one hosted Linux check.
# No push/schedule runs; the branch's code is checked before it reaches main.
on:
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "crates/**"
      - "scripts/**"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      - ".github/actions/**"
      - ".github/workflows/fork-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'miaopan607/oh-my-pi'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Verify upstream release selection policy
        run: node --test scripts/fork/select-upstream-release.test.mjs scripts/fork/release-version.test.mjs

      - name: Verify pinned settings conflict resolution against official v18.18.6
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          file="$workdir/packages/coding-agent/src/config/settings.ts"
          mkdir -p "$(dirname "$file")"
          curl --fail --location --silent --show-error --retry 3 \
            https://raw.githubusercontent.com/can1357/oh-my-pi/v18.18.6/packages/coding-agent/src/config/settings.ts \
            > "$file"
          # Refuse a retargeted/mismatched upstream file.
          test "$(git hash-object "$file")" = "20cb006d754daed7e8722200558d682878707d3e"
          (
            cd "$workdir"
            git apply --check "$GITHUB_WORKSPACE/scripts/fork/patches/settings-v18.18.6.patch"
            git apply "$GITHUB_WORKSPACE/scripts/fork/patches/settings-v18.18.6.patch"
          )
          grep -Fq 'cfgDisabledProviders' "$file"
          grep -Fq 'OMP_MP_CONFIG_FILE' "$file"
          grep -Fq 'officialGlobal: this.#officialGlobal' "$file"

      - uses: ./.github/actions/bun-install

      - name: TypeScript format, lint and types
        run: bun run check:ts

      - name: Install native addon build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config clang libclang-dev libasound2-dev nasm

      - name: Build native addon for regression tests
        env:
          OMP_NATIVE_CARGO_PROFILE: ci
        run: bun scripts/bazel-natives.ts host --dest packages/natives/native

      - name: Fork auth, status line and settings regressions
        run: |
          bun test \
            packages/ai/test/auth-broker-usage-freshness.test.ts \
            packages/coding-agent/test/status-line-usage-refresh.test.ts \
            packages/coding-agent/test/config/fork-settings-isolation.test.ts \
            packages/coding-agent/test/config/settings-entry-writes.test.ts \
            packages/coding-agent/test/config/settings-reload.test.ts
